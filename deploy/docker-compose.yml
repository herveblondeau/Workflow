services:
  workflow-api:
    build:
      context: ..
      dockerfile: Main.Api/Dockerfile
    image: workflow-api
    container_name: workflow-api
    # Bound to loopback only: the operator's own reverse proxy (nginx, Caddy,
    # whatever) runs on the host and proxies to this port. TLS termination
    # and public routing are that reverse proxy's job, not this compose file's.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - workflow-storage:/app/storage
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      API_KEY: ${API_KEY}
      Filigrane__StoragePath: /app/storage
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_DEFAULT_MODEL: ${ANTHROPIC_DEFAULT_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-}
    restart: unless-stopped

volumes:
  workflow-storage:
    driver: local
